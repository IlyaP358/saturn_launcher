app-id: com.github.IlyaP358.SaturnLauncher
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: saturn
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=home
  - --filesystem=~/.icons:ro
  - --filesystem=~/.local/share/icons:ro
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: saturn-launcher
    buildsystem: simple
    build-commands:
      # Install binary
      - install -D dist/saturn_linux /app/bin/saturn
      # Install assets (icon/desktop)
      - install -Dm644 com.github.IlyaP358.SaturnLauncher.desktop /app/share/applications/com.github.IlyaP358.SaturnLauncher.desktop
      - install -Dm644 logo_cli_512.png /app/share/icons/hicolor/512x512/apps/com.github.IlyaP358.SaturnLauncher.png
    sources:
      - type: dir
        path: .
